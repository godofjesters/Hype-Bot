<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hype Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body{% if theme is defined %} data-theme="{{ theme }}"{% endif %}>
  <header class="topbar">
    <a class="brand" href="/">Hype Bot</a>
    {% if username %}
    <div class="account">
      <span>{{ username }}</span>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="quiet-button" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
