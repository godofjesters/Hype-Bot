{% extends "base.html" %}
{% block title %}Sign in · Hype Bot{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">Private dashboard</p>
  <h1>Sign in to Hype Bot</h1>
  <p class="muted">Use the admin credentials configured for this server.</p>
  {% if error %}<p class="alert" role="alert">That username or password wasn’t recognized.</p>{% endif %}
  <form action="/login" method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary-button" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
